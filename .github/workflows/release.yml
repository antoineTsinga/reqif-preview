name: Publication npm

# Publishing is driven by a GitHub Release: draft it, write the notes, publish
# it, and this runs. The tag and the notes therefore exist before the tarball
# does, and a failed run is re-runnable from the Actions tab without having to
# invent a new version number.
on:
  release:
    types: [published]
  # Kept for a re-run after fixing a transient failure. It publishes whatever
  # `main` currently holds, so only use it when main is the release commit.
  workflow_dispatch:

permissions:
  contents: read
  # The whole authentication story. npm exchanges this OIDC token for a
  # short-lived publish credential, so the repository holds no npm secret at
  # all — nothing to leak, rotate, or forget to revoke.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14 and npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build: the tarball must come from
          # a clean resolve, not from whatever a previous run left behind.

      # Node 24 already ships npm 11, but which patch it ships changes over
      # time. Pinning the floor here means a Node image update can never drop
      # the runner below the version that understands OIDC — a failure that
      # would otherwise appear as an opaque auth error.
      - name: npm >= 11.5.1, required for OIDC
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      # The one check that cannot be recovered from after the fact: npm refuses
      # to republish a version, so a mismatch here would burn the number.
      - name: The tag must match package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME annonce $tag, package.json dit $pkg."
            exit 1
          fi
          echo "version $pkg"

      - name: Already on npm?
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          if npm view "reqif-preview@$pkg" version >/dev/null 2>&1; then
            echo "::error::reqif-preview@$pkg est déjà publié. Montez la version."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # No NODE_AUTH_TOKEN: the OIDC exchange is what authenticates, and npm
      # attaches a provenance attestation on its own — `--provenance` is
      # implied by trusted publishing, not something to pass here.
      #
      # `npm publish` also runs prepublishOnly, which builds and tests again.
      # That is deliberate: the tarball must come from this checkout, never
      # from a dist/ someone had lying around.
      - name: Publish
        run: npm publish
